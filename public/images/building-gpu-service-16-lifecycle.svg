<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#F7F4EC"/>
  <text x="60" y="70" fill="#161616" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700">Part 16: Worker Lifecycle</text>
  <text x="62" y="108" fill="#4E4A43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Prewarm, idle scale-down, and metrics-driven worker state.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#242424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #242424; stroke-width: 2; }
      .dark { fill: #222633; stroke: #222633; stroke-width: 2; }
      .accent { fill: #E8F2C2; stroke: #242424; stroke-width: 2; }
      .warn { fill: #F8D9C4; stroke: #242424; stroke-width: 2; }
      .label { fill: #171717; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; }
      .small { fill: #444; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .white { fill: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
      .line { stroke: #242424; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke: #6C665D; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="54" y="160" width="205" height="96" rx="16"/>
  <text class="label" x="78" y="197">Control Plane</text>
  <text class="small" x="78" y="225">validates request</text>
  <text class="small" x="78" y="245">publishes ingress</text>

  <rect class="dark" x="335" y="137" width="248" height="150" rx="18"/>
  <text class="white" x="365" y="176">NATS JetStream</text>
  <text class="white" x="365" y="210">invoke.&lt;requestID&gt;</text>
  <text class="white" x="365" y="236">result.&lt;requestID&gt;</text>
  <text class="white" x="365" y="262">metrics.&lt;requestID&gt;</text>

  <rect class="accent" x="675" y="100" width="250" height="255" rx="18"/>
  <text class="label" x="705" y="140">Dedicated Activator</text>
  <rect class="box" x="705" y="165" width="190" height="43" rx="10"/>
  <text class="small" x="725" y="192">ingress consumer</text>
  <rect class="box" x="705" y="222" width="190" height="43" rx="10"/>
  <text class="small" x="725" y="249">metrics state</text>
  <rect class="box" x="705" y="279" width="190" height="43" rx="10"/>
  <text class="small" x="725" y="306">lifecycle reconcile</text>

  <rect class="box" x="58" y="390" width="286" height="142" rx="18"/>
  <text class="label" x="86" y="430">GPUUnit Pool</text>
  <text class="small" x="86" y="460">template GPUUnit preserved</text>
  <text class="small" x="86" y="482">managed workers created</text>
  <text class="small" x="86" y="504">idle workers deleted</text>

  <rect class="box" x="430" y="388" width="250" height="142" rx="18"/>
  <text class="label" x="456" y="428">Worker Pod</text>
  <text class="small" x="456" y="458">sidecar owns NATS</text>
  <text class="small" x="456" y="480">framework uses UDS</text>
  <text class="small" x="456" y="502">user handler stays local</text>

  <rect class="warn" x="805" y="417" width="290" height="86" rx="16"/>
  <text class="label" x="835" y="452">Lifecycle Policy</text>
  <text class="small" x="835" y="478">minAvailableCount</text>
  <text class="small" x="835" y="496">idleTimeoutSeconds</text>

  <line class="line" x1="259" y1="208" x2="335" y2="208"/>
  <line class="line" x1="583" y1="210" x2="675" y2="190"/>
  <line class="line" x1="800" y1="355" x2="800" y2="417"/>
  <line class="line" x1="705" y1="302" x2="344" y2="450"/>
  <line class="line" x1="344" y1="460" x2="430" y2="460"/>
  <line class="dash" x1="680" y1="460" x2="805" y2="460"/>
  <path class="dash" d="M555 388C555 334 500 318 462 287"/>
  <path class="dash" d="M680 430C760 370 640 308 583 252"/>
  <text class="small" x="602" y="336">worker events</text>
  <text class="small" x="348" y="438">create/delete</text>
</svg>
